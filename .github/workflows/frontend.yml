name: Frontend

# The pull_request paths below are mirrored in main.yml (job `changes`, filter `frontend`):
# keep both lists in sync.
on:
  pull_request:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'packages/shared/**'
      - 'e2e/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/check-public-boundary.mjs'
      - 'Dockerfile'
      - 'infra/nginx.conf'
      - 'backend/openapi/**'
      - '.github/workflows/frontend.yml'
      - 'tsconfig.base.json'
      - 'eslint.config.mjs'
      - '.dockerignore'
      - '.github/workflows/main.yml'
      - '.github/actions/**'
  workflow_call:
    inputs:
      publish:
        description: Build and push the web image to GHCR as :<sha> (main.yml moves :pre once every job passed).
        type: boolean
        default: false
      platforms:
        description: Image platforms. main.yml passes linux/amd64 on pushes to main and adds linux/arm64 for v* tags.
        type: string
        default: linux/amd64

permissions:
  contents: read
  packages: write

# Pull requests cancel superseded runs. When called from main.yml the group is
# unique per run (main.yml already serialises and must never cancel a deploy).
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('frontend-pr-{0}', github.ref) || format('frontend-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint web, shared and e2e
        run: npm run lint -w @pokemon-universe/web -w @pokemon-universe/shared -w @pokemon-universe/e2e

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build shared contracts
        run: npm run build -w @pokemon-universe/shared
      - name: Typecheck web and e2e
        run: npm run typecheck -w @pokemon-universe/web -w @pokemon-universe/e2e

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check the browser contract boundary
        run: npm run check:boundaries
      - name: Build shared contracts
        run: npm run build -w @pokemon-universe/shared
      - name: Test web and shared
        run: npm test -w @pokemon-universe/web -w @pokemon-universe/shared

  # No bloqueante: un aviso de terceros no frena el despliegue. Solo las dependencias de producción de la web (lo que
  # acaba en el bundle); el resultado va al resumen.
  audit:
    name: Audit web production dependencies
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: npm audit
        shell: bash
        run: |
          set -uo pipefail
          status=0
          npm audit --omit=dev --audit-level=high -w @pokemon-universe/web > audit.txt 2>&1 || status=$?
          cat audit.txt
          {
            if [ "$status" -eq 0 ]; then
              echo "### npm audit (web): sin vulnerabilidades altas o críticas"
            else
              echo "### npm audit (web): vulnerabilidades altas o críticas (no bloqueante)"
            fi
            echo
            echo '```text'
            tail -n 60 audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  # Solo en PRs: al publicar, la build del Dockerfile ya compila shared y web.
  build:
    name: Build
    if: ${{ !inputs.publish }}
    needs: [lint, typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build shared and web
        run: |
          npm run build -w @pokemon-universe/shared
          npm run build -w @pokemon-universe/web

  # En paralelo con lint, typecheck y test: solo publica :<sha>. main.yml no despliega ni mueve :pre si alguno
  # de ellos falla.
  image:
    name: Publish web image
    if: inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        if: contains(inputs.platforms, 'arm64')
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: web
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/pokemon-universe-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
          provenance: mode=max
          sbom: true
