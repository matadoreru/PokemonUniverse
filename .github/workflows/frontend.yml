name: Frontend

# The pull_request paths below are mirrored in main.yml (job `changes`, filter `frontend`):
# keep both lists in sync.
on:
  pull_request:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'packages/shared/**'
      - 'e2e/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/export-game-registry.mjs'
      - 'scripts/check-public-boundary.mjs'
      - 'apps/server/**'
      - 'scripts/export-golden-*.mjs'
      - 'backend/src/test/resources/golden/**'
      - 'Dockerfile'
      - 'infra/nginx.conf'
      - 'backend/openapi/**'
      - '.github/workflows/frontend.yml'
      - 'tsconfig.base.json'
      - 'eslint.config.mjs'
      - '.dockerignore'
      - '.github/workflows/main.yml'
      - '.github/actions/**'
  workflow_call:
    inputs:
      publish:
        description: Build and push the web image to GHCR.
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

# Pull requests cancel superseded runs. When called from main.yml the group is
# unique per run (main.yml already serialises and must never cancel a deploy).
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('frontend-pr-{0}', github.ref) || format('frontend-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint web, shared and e2e
        run: npm run lint -w @pokemon-universe/web -w @pokemon-universe/shared -w @pokemon-universe/e2e

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build shared contracts
        run: npm run build -w @pokemon-universe/shared
      - name: Typecheck web and e2e
        run: npm run typecheck -w @pokemon-universe/web -w @pokemon-universe/e2e

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check the browser contract boundary
        run: npm run check:boundaries
      - name: Build shared contracts
        run: npm run build -w @pokemon-universe/shared
      - name: Check the exported game registry
        run: npm run check:registry
      - name: Test web and shared
        run: npm test -w @pokemon-universe/web -w @pokemon-universe/shared

  # No bloqueante: un aviso de terceros no frena el despliegue. Solo las dependencias de producción de la web (lo que
  # acaba en el bundle); el resultado va al resumen.
  audit:
    name: Audit web production dependencies
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: npm audit
        shell: bash
        run: |
          set -uo pipefail
          status=0
          npm audit --omit=dev --audit-level=high -w @pokemon-universe/web > audit.txt 2>&1 || status=$?
          cat audit.txt
          {
            if [ "$status" -eq 0 ]; then
              echo "### npm audit (web): sin vulnerabilidades altas o críticas"
            else
              echo "### npm audit (web): vulnerabilidades altas o críticas (no bloqueante)"
            fi
            echo
            echo '```text'
            tail -n 60 audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  # Oráculo Node (apps/server): sin imagen ni despliegue desde el corte 2D, pero sus tests y las fixtures doradas
  # (que el backend Java compara) siguen siendo parte de `npm test` y bloquean la imagen web como antes.
  oracle:
    name: Node oracle and golden fixtures
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pokemon_universe_test
          POSTGRES_USER: pokemon_test
          POSTGRES_PASSWORD: pokemon_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pokemon_test -d pokemon_universe_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://pokemon_test:pokemon_test_password@127.0.0.1:5432/pokemon_universe_test?schema=public
      TEST_DATABASE_URL: postgresql://pokemon_test:pokemon_test_password@127.0.0.1:5432/pokemon_universe_test?schema=public
      JWT_SECRET: github-actions-only-secret-with-32-characters
      WEB_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      # Esquema del modelo congelado del oráculo, solo en la BD de prueba de este job.
      - name: Apply the oracle's Prisma migrations to the test database
        run: npm run db:deploy -w @pokemon-universe/server
      - name: Build shared contracts
        run: npm run build -w @pokemon-universe/shared
      - name: Typecheck
        run: npm run typecheck -w @pokemon-universe/server
      - name: Lint
        run: npm run lint -w @pokemon-universe/server
      - name: Test
        run: npm test -w @pokemon-universe/server
      - name: Build
        run: npm run build -w @pokemon-universe/server
      # The golden harness loads the catalog through the server dist built above.
      - name: Typecheck and check golden fixtures
        run: |
          npx tsc -p packages/shared/golden/tsconfig.json
          npm run check:golden

  build:
    name: Build
    needs: [lint, typecheck, test, oracle]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build shared and web
        run: |
          npm run build -w @pokemon-universe/shared
          npm run build -w @pokemon-universe/web

  image:
    name: Publish web image
    needs: build
    if: inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # :pre only moves on main, so a tag push on an older commit or a manual
      # run from another branch never rewinds the image main.yml retags from.
      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: web
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ github.ref == 'refs/heads/main' && format('ghcr.io/{0}/pokemon-universe-web:pre', github.repository_owner) || '' }}
            ghcr.io/${{ github.repository_owner }}/pokemon-universe-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
          provenance: mode=max
          sbom: true
