name: Main

# Every push to main builds only what changed, gives every image the commit SHA
# (unchanged images are retagged from :pre) and deploys that SHA to PRE.
# v* tags rebuild everything and add the tag name; they never deploy.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Never cancel a run in progress: it may be deploying.
concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      # workflow_dispatch and tag pushes force every build.
      frontend: ${{ github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || steps.filter.outputs.frontend == 'true' }}
      node: ${{ github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || steps.filter.outputs.node == 'true' }}
      backend: ${{ github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || steps.filter.outputs.backend == 'true' }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')

      # Keep these lists in sync with the pull_request paths of each workflow.
      - name: Filter changed paths
        id: filter
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        uses: dorny/paths-filter@v4
        with:
          filters: |
            frontend:
              - 'apps/web/**'
              - 'packages/shared/**'
              - 'e2e/**'
              - 'package.json'
              - 'package-lock.json'
              - 'scripts/export-game-registry.mjs'
              - 'scripts/check-public-boundary.mjs'
              - 'Dockerfile'
              - 'infra/nginx.conf'
              - 'backend/openapi/**'
              - '.github/workflows/frontend.yml'
            node:
              - 'apps/server/**'
              - 'packages/shared/**'
              - 'Dockerfile'
              - 'scripts/start-server.sh'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/node-server.yml'
            backend:
              - 'backend/**'
              - '.github/workflows/backend.yml'

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/frontend.yml
    with:
      publish: true
    secrets: inherit

  node:
    name: Node server
    needs: changes
    if: needs.changes.outputs.node == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/node-server.yml
    with:
      publish: true
    secrets: inherit

  backend:
    name: Backend Java
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/backend.yml
    with:
      publish: true
    secrets: inherit

  # Skipped builds count as "skipped", not "failure": retag runs unless a build
  # that did run failed (or the run was cancelled).
  retag:
    name: Tag every image with the commit SHA
    needs: [changes, frontend, node, backend]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.frontend.result != 'failure' && needs.node.result != 'failure' && needs.backend.result != 'failure' }}
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
      BUILT_WEB: ${{ needs.changes.outputs.frontend }}
      BUILT_SERVER: ${{ needs.changes.outputs.node }}
      BUILT_BACKEND: ${{ needs.changes.outputs.backend }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag unchanged images from :pre
        shell: bash
        run: |
          set -euo pipefail
          retag() {
            local image="$REGISTRY/$1"
            if ! docker buildx imagetools inspect "$image:pre" > /dev/null 2>&1; then
              echo "::error::$image:pre no existe todavía. Lanza Main manualmente (workflow_dispatch) sobre main una vez: fuerza todas las builds y publica :pre."
              exit 1
            fi
            docker buildx imagetools create --tag "$image:$GITHUB_SHA" "$image:pre"
            echo "- \`$1\`: reetiquetada desde \`:pre\`" >> "$GITHUB_STEP_SUMMARY"
          }
          echo "### Imágenes de \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          for entry in "pokemon-universe-web:$BUILT_WEB" "pokemon-universe-server:$BUILT_SERVER" "pokemon-universe-backend:$BUILT_BACKEND"; do
            name="${entry%%:*}"
            built="${entry#*:}"
            if [ "$built" = 'true' ]; then
              echo "- \`$name\`: construida en esta ejecución" >> "$GITHUB_STEP_SUMMARY"
            else
              retag "$name"
            fi
          done

      - name: Add the version tag to every image
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for name in pokemon-universe-web pokemon-universe-server pokemon-universe-backend; do
            docker buildx imagetools create --tag "$REGISTRY/$name:$VERSION" "$REGISTRY/$name:$GITHUB_SHA"
          done
          echo "### Versión \`$VERSION\` → \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"

  deploy-pre:
    name: Deploy immutable SHA to PRE
    needs: [retag]
    if: ${{ !cancelled() && needs.retag.result == 'success' && github.ref == 'refs/heads/main' && vars.PRE_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    concurrency:
      group: pokemon-universe-pre
      cancel-in-progress: false
    environment:
      name: pre
      url: ${{ vars.PUBLIC_URL }}
    steps:
      # The composite action is resolved from the workspace.
      - uses: actions/checkout@v7

      - name: Deploy to PRE
        uses: ./.github/actions/deploy-ssh
        with:
          host: ${{ vars.DEPLOY_HOST }}
          port: ${{ vars.DEPLOY_PORT || '22' }}
          user: ${{ vars.DEPLOY_USER }}
          path: ${{ vars.DEPLOY_PATH }}
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          ts-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts-oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          sha: ${{ github.sha }}
          summary-title: PRE desplegado
