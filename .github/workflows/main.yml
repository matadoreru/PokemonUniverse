name: Main

# Every push to main builds only what changed (linux/amd64, the PRE/PRO host), in
# parallel with the tests; gives every image the commit SHA (unchanged images are
# retagged from :pre), moves :pre once everything passed and deploys that SHA to PRE.
# v* tags and manual runs rebuild everything for linux/amd64 and linux/arm64 (with
# the arm64 WebP smoke test) and add the tag name; they never deploy.
# The experimental native backend image is built by hand (backend-native.yml).
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Never cancel a run in progress: it may be deploying.
concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Change detection compares against the head SHA of the last *successful* Main
  # run on main, not against the previous push: after a failed or superseded run,
  # every area changed since the last green run is rebuilt, so retag never copies
  # a stale :pre onto a newer SHA. With no green run yet (first run ever), a base
  # that is not an ancestor of this commit, workflow_dispatch or a tag push, both
  # flags are forced to true.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      frontend: ${{ steps.base.outputs.force == 'true' || steps.filter.outputs.frontend == 'true' }}
      backend: ${{ steps.base.outputs.force == 'true' || steps.filter.outputs.backend == 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Find the last green Main run on main
        id: base
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          force() {
            echo "$1 → se construyen las dos imágenes" | tee -a "$GITHUB_STEP_SUMMARY"
            echo 'force=true' >> "$GITHUB_OUTPUT"
            exit 0
          }
          if [ "$EVENT_NAME" != 'push' ] || [ "$GITHUB_REF" != 'refs/heads/main' ]; then
            force "Evento $EVENT_NAME en $GITHUB_REF"
          fi
          base=$(gh run list --workflow main.yml --branch main --status success --limit 1 --json headSha --jq '.[0].headSha // empty')
          if [ -z "$base" ]; then
            force 'No hay ninguna ejecución verde de Main en main'
          fi
          if ! git merge-base --is-ancestor "$base" "$GITHUB_SHA"; then
            force "El último Main verde ($base) no es ancestro de $GITHUB_SHA"
          fi
          echo "Cambios detectados desde el último Main verde: \`$base\`" >> "$GITHUB_STEP_SUMMARY"
          echo 'force=false' >> "$GITHUB_OUTPUT"
          echo "sha=$base" >> "$GITHUB_OUTPUT"

      # Keep these lists in sync with the pull_request paths of each workflow.
      - name: Filter changed paths
        id: filter
        if: steps.base.outputs.force == 'false'
        uses: dorny/paths-filter@v4
        with:
          base: ${{ steps.base.outputs.sha }}
          ref: ${{ github.sha }}
          filters: |
            frontend:
              - 'frontend/**'
              - 'packages/shared/**'
              - 'e2e/**'
              - 'package.json'
              - 'package-lock.json'
                      - 'scripts/check-public-boundary.mjs'
                                      - 'Dockerfile'
              - 'infra/nginx.conf'
              - 'backend/openapi/**'
              - 'tsconfig.base.json'
              - 'eslint.config.mjs'
              - '.dockerignore'
              - '.github/workflows/frontend.yml'
              - '.github/workflows/main.yml'
              - '.github/actions/**'
            backend:
              - 'backend/**'
              - 'compose.yaml'
              - '.github/workflows/backend.yml'
              - '.github/workflows/main.yml'
              - '.github/actions/**'

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/frontend.yml
    with:
      publish: true
      platforms: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
    secrets: inherit

  backend:
    name: Backend Java
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/backend.yml
    with:
      publish: true
      platforms: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
    secrets: inherit

  # Skipped builds count as "skipped", not "failure": retag runs unless a build
  # that did run failed (or the run was cancelled). The images are pushed as
  # :<sha> in parallel with the tests; :pre only moves here, after every test of
  # this run passed, so it never points at a red commit.
  retag:
    name: Tag every image with the commit SHA
    needs: [changes, frontend, backend]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.frontend.result != 'failure' && needs.backend.result != 'failure' }}
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
      BUILT_WEB: ${{ needs.changes.outputs.frontend }}
      BUILT_BACKEND: ${{ needs.changes.outputs.backend }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag unchanged images from :pre
        shell: bash
        run: |
          set -euo pipefail
          retag() {
            local image="$REGISTRY/$1"
            if ! docker buildx imagetools inspect "$image:pre" > /dev/null 2>&1; then
              echo "::error::$image:pre no existe todavía. Lanza Main manualmente (workflow_dispatch) sobre main: fuerza todas las builds y publica :pre."
              exit 1
            fi
            docker buildx imagetools create --tag "$image:$GITHUB_SHA" "$image:pre"
            echo "- \`$1\`: reetiquetada desde \`:pre\`" >> "$GITHUB_STEP_SUMMARY"
          }
          echo "### Imágenes de \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          for entry in "pokemon-universe-web:$BUILT_WEB" "pokemon-universe-backend:$BUILT_BACKEND"; do
            name="${entry%%:*}"
            built="${entry#*:}"
            if [ "$built" = 'true' ]; then
              # :pre only moves on main, so a tag push on an older commit or a manual
              # run from another branch never rewinds the image this job retags from.
              if [ "$GITHUB_REF" = 'refs/heads/main' ]; then
                docker buildx imagetools create --tag "$REGISTRY/$name:pre" "$REGISTRY/$name:$GITHUB_SHA"
                echo "- \`$name\`: construida en esta ejecución; \`:pre\` apunta a ella" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "- \`$name\`: construida en esta ejecución" >> "$GITHUB_STEP_SUMMARY"
              fi
            else
              retag "$name"
            fi
          done

      - name: Add the version tag to every image
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for name in pokemon-universe-web pokemon-universe-backend; do
            docker buildx imagetools create --tag "$REGISTRY/$name:$VERSION" "$REGISTRY/$name:$GITHUB_SHA"
          done
          echo "### Versión \`$VERSION\` → \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"

  deploy-pre:
    name: Deploy immutable SHA to PRE
    needs: [retag]
    if: ${{ !cancelled() && needs.retag.result == 'success' && github.ref == 'refs/heads/main' && vars.PRE_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    concurrency:
      group: pokemon-universe-pre
      cancel-in-progress: false
    environment:
      name: pre
      url: ${{ vars.PUBLIC_URL }}
    steps:
      # The composite action is resolved from the workspace.
      - uses: actions/checkout@v7

      - name: Deploy to PRE
        uses: ./.github/actions/deploy-ssh
        with:
          host: ${{ vars.DEPLOY_HOST }}
          port: ${{ vars.DEPLOY_PORT || '22' }}
          user: ${{ vars.DEPLOY_USER }}
          path: ${{ vars.DEPLOY_PATH }}
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          ts-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts-oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          sha: ${{ github.sha }}
          summary-title: PRE desplegado
