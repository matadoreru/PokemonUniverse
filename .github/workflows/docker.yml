name: Validate and publish Docker images

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Pokémon Universe
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pokemon_universe_test
          POSTGRES_USER: pokemon_test
          POSTGRES_PASSWORD: pokemon_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pokemon_test -d pokemon_universe_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://pokemon_test:pokemon_test_password@127.0.0.1:5432/pokemon_universe_test?schema=public
      JWT_SECRET: github-actions-only-secret-with-32-characters
      WEB_ORIGIN: http://localhost:5173
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply PostgreSQL migrations
        run: npm run db:deploy -w @pokemon-universe/server

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify production artifacts
        run: |
          test -x ./apps/server/node_modules/.bin/prisma
          test -f ./apps/server/dist/src/index.js

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  publish:
    name: Publish server and web images
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Both targets depend on the same native build stage. Keeping them in one
      # Buildx job lets the server reuse the web build instead of compiling the
      # entire monorepo again in a separate runner.
      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: web
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            PU_COMMIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/pokemon-universe-web:pre
            ghcr.io/${{ github.repository_owner }}/pokemon-universe-web:${{ github.sha }}
          cache-from: |
            type=gha,scope=application
            type=gha,scope=web
          provenance: mode=max
          sbom: true

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: server
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            PU_COMMIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/pokemon-universe-server:pre
            ghcr.io/${{ github.repository_owner }}/pokemon-universe-server:${{ github.sha }}
          cache-from: |
            type=gha,scope=application
            type=gha,scope=server
          cache-to: type=gha,mode=max,scope=application
          provenance: mode=max
          sbom: true

  deploy-pre:
    name: Deploy immutable SHA to PRE
    needs: publish
    if: needs.publish.result == 'success' && vars.PRE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: pokemon-universe-pre
      cancel-in-progress: true
    environment:
      name: pre
      url: ${{ vars.PUBLIC_URL }}
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - name: Configure verified SSH access
        shell: bash
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Define DEPLOY_HOST in the pre environment}"
          : "${DEPLOY_USER:?Define DEPLOY_USER in the pre environment}"
          : "${DEPLOY_PATH:?Define DEPLOY_PATH in the pre environment}"
          : "${DEPLOY_SSH_KEY:?Define DEPLOY_SSH_KEY in the pre environment}"
          : "${DEPLOY_KNOWN_HOSTS:?Define DEPLOY_KNOWN_HOSTS in the pre environment}"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/pokemon-universe"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/pokemon-universe" "$HOME/.ssh/known_hosts"

      - name: Deploy tested commit to PRE
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/pokemon-universe" -p "$DEPLOY_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -eu; cd '$DEPLOY_PATH'; git fetch --prune origin; git checkout --detach '$GITHUB_SHA'; chmod +x scripts/*.sh; ./scripts/deploy.sh '$GITHUB_SHA'"

      - name: Publish deployment summary
        run: echo "### PRE desplegado con \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
