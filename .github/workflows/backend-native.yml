name: Backend native image (experimental)

# Experimental (stage 1): the native binary still crashes at runtime. Built by
# hand only (Actions → Run workflow), so it never slows down a push to main.
# Publishes :<sha>-native; Compose keeps deploying the JVM image.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Publish backend native image
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push native image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.native
          platforms: linux/amd64
          push: true
          build-args: |
            PU_COMMIT_SHA=${{ github.sha }}
          tags: ghcr.io/${{ github.repository_owner }}/pokemon-universe-backend:${{ github.sha }}-native
          cache-from: type=gha,scope=backend-native
          cache-to: type=gha,mode=max,scope=backend-native
          provenance: mode=max
          sbom: true
