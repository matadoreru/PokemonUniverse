name: Backend Java

# The pull_request paths below are mirrored in main.yml (job `changes`, filter `backend`):
# keep both lists in sync.
on:
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'compose.yaml'
      - '.github/workflows/backend.yml'
      - '.github/workflows/main.yml'
      - '.github/actions/**'
  workflow_call:
    inputs:
      publish:
        description: Build and push the backend JVM image to GHCR as :<sha> (main.yml moves :pre once every job passed).
        type: boolean
        default: false
      platforms:
        description: Image platforms. main.yml passes linux/amd64 on pushes to main and adds linux/arm64 for v* tags.
        type: string
        default: linux/amd64

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('backend-pr-{0}', github.ref) || format('backend-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Gradle check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      # Only main writes the Gradle cache; pull requests read it.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # check = tests (Testcontainers uses the runner's Docker) + verifyOpenApi.
      - name: Gradle check
        run: ./gradlew check --no-daemon

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: backend/build/reports/tests
          if-no-files-found: ignore

  # Review Focus 5 del corte 2D: la libwebp nativa de los avatares tiene que cargar y codificar en linux/arm64. Se
  # construye la imagen arm64 (Gradle en la plataforma del runner, el resto bajo QEMU) y se ejecuta
  # es.pokemonuniverse.tools.WebpEncoderSmoke con el sistema de archivos de solo lectura y /tmp noexec, como en
  # compose.yaml: así se prueba la carga desde /app/native que usa producción.
  # Solo en PRs y cuando se publica arm64 (tags v*, ejecución manual): un push normal a main publica solo amd64 y no
  # espera a QEMU. Va en paralelo con check.
  webp-arm64:
    name: WebP encoder smoke test on linux/arm64
    if: github.event_name == 'pull_request' || contains(inputs.platforms, 'arm64')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the arm64 backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/arm64
          load: true
          tags: pokemon-universe-backend:arm64-smoke
          cache-from: type=gha,scope=backend

      - name: Encode a WebP avatar on arm64
        run: |
          docker run --rm --platform linux/arm64 --read-only --tmpfs /tmp:size=64m,noexec \
            --entrypoint java pokemon-universe-backend:arm64-smoke \
            --enable-native-access=ALL-UNNAMED -cp /app/app.jar es.pokemonuniverse.tools.WebpEncoderSmoke

  # En paralelo con check: solo publica :<sha>. main.yml no despliega ni mueve :pre si check o webp-arm64 fallan.
  image:
    name: Publish backend JVM image
    if: inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The Gradle stage runs on the build platform; the arm64 runtime stage
      # still executes RUN under emulation.
      - name: Set up QEMU
        if: contains(inputs.platforms, 'arm64')
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: ${{ inputs.platforms }}
          push: true
          build-args: |
            PU_COMMIT_SHA=${{ github.sha }}
          tags: ghcr.io/${{ github.repository_owner }}/pokemon-universe-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          provenance: mode=max
          sbom: true
