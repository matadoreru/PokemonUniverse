name: Deploy scripts

# Simulación del despliegue (scripts/test-deploy-rollback.sh: docker y git falsos, configuración real de
# `docker compose config`, sin daemon) y shellcheck de los scripts. Independiente de main.yml: no construye imágenes.
on:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/**'
      - 'compose.yaml'
      - '.github/workflows/deploy-scripts.yml'
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - 'compose.yaml'
      - '.github/workflows/deploy-scripts.yml'

permissions:
  contents: read

concurrency:
  group: deploy-scripts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rollback:
    name: Deploy rollback simulation and shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # El test lee compose.yaml de commits anteriores (9275fd9 y ac5b3ff).
          fetch-depth: 0

      - name: Shellcheck
        run: shellcheck scripts/*.sh

      - name: Deploy rollback simulation
        run: bash scripts/test-deploy-rollback.sh
