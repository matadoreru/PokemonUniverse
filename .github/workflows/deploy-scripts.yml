name: Deploy scripts

# Simulación del despliegue (scripts/test-deploy-rollback.sh: docker falso, configuración real de
# `docker compose config`, sin daemon), shellcheck de los scripts y sus tests de Node (`npm run test:scripts`, sin
# dependencias). Independiente de main.yml: no construye imágenes.
on:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/**'
      - 'compose.yaml'
      - 'package.json'
      - '.github/workflows/deploy-scripts.yml'
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - 'compose.yaml'
      - 'package.json'
      - '.github/workflows/deploy-scripts.yml'

permissions:
  contents: read

concurrency:
  group: deploy-scripts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rollback:
    name: Deploy rollback simulation and shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Shellcheck
        run: shellcheck scripts/*.sh

      - name: Deploy rollback simulation
        run: bash scripts/test-deploy-rollback.sh

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Script tests
        run: npm run test:scripts
