micronaut:
  application:
    name: pokemon-universe-backend
  server:
    port: ${PORT:8080}
    # Segunda guarda tras el latido de /ws (pu.ws.heartbeat-seconds): Netty cierra una conexión inactiva al cumplirse.
    idle-timeout: ${SERVER_IDLE_TIMEOUT:10m}
    # Detección de clientes muertos (pingTimeout de Socket.IO): un cliente vivo contesta cada ping de 25 s con un pong,
    # así que 60 s sin leer nada (≈ 2,4 latidos) cierran la conexión (1001) y el coordinador ve la desconexión.
    read-idle-timeout: ${WS_READ_IDLE_TIMEOUT:60s}
    write-idle-timeout: ${SERVER_IDLE_TIMEOUT:10m}
  router:
    static-resources:
      swagger:
        paths: classpath:META-INF/swagger
        mapping: /swagger/**
      swagger-ui:
        paths: classpath:META-INF/swagger/views/swagger-ui
        mapping: /swagger-ui/**
  metrics:
    enabled: true
    export:
      prometheus:
        enabled: true
        step: PT1M
        descriptions: true
  serde:
    serialization:
      inclusion: NON_NULL
endpoints:
  health:
    enabled: true
    sensitive: false
    details-visible: ANONYMOUS
    disk-space:
      enabled: false
  prometheus:
    enabled: true
    sensitive: false
datasources:
  default:
    driver-class-name: org.postgresql.Driver
    dialect: POSTGRES
# Flyway es el único dueño del esquema. Fuera de test migra FlywayMigrations al arrancar, con sus propios ajustes en
# código (BD vacía: V1__baseline.sql crea el esquema completo; BD creada por Prisma sin historial: baseline en la
# versión 1 sin ejecutar V1). La migración automática de Micronaut solo se activa en test (application-test.yml).
flyway:
  datasources:
    default:
      enabled: false
jpa:
  default:
    entity-scan:
      packages: es.pokemonuniverse.adapters.out.persistence
    properties:
      hibernate:
        globally_quoted_identifiers: true
        globally_quoted_identifiers_skip_column_definitions: true
        physical_naming_strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        jdbc:
          time_zone: UTC
        hbm2ddl:
          auto: none
pu:
  auth:
    cookie-secure: ${COOKIE_SECURE:false}
  web-origin: ${WEB_ORIGIN:http://localhost:5173}
  rate-limit-disabled: ${RATE_LIMIT_DISABLED:false}
  avatar-storage-dir: ${AVATAR_STORAGE_DIR:.data/avatars}
  # PNG del modo Artwork (local-artwork:<id>). Relativo a backend/, desde donde se ejecuta dev:backend; la imagen los
  # copia en /app/pokemon-artworks y compose fija POKEMON_ARTWORK_DIR.
  artwork-dir: ${POKEMON_ARTWORK_DIR:assets/pokemon-artworks}
  commit-sha: ${PU_COMMIT_SHA:}
  room-max-players: ${ROOM_MAX_PLAYERS:8}
  reconnect-grace-ms: ${RECONNECT_GRACE_MS:30000}
  # Resultados de una partida: si queda sesión y el host no sigue antes, la sala sigue sola pasado este plazo.
  results-auto-continue-ms: ${ROOM_RESULTS_AUTO_CONTINUE_MS:20000}
  # Intro de cada partida (nombre, reglas y «¡Listo!»): termina antes si todos los jugadores conectados están listos.
  game-intro-ms: ${ROOM_GAME_INTRO_MS:8000}
  # Correo saliente (recuperar contraseña). Sin SMTP_HOST el correo solo se registra en el log.
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:465}
    user: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    from: ${MAIL_FROM:Pokémon Universe <no-responder@matadoreru.com>}
  # Los tres interruptores de producción (INTERRUPT_STALE_ROOMS, ROOMS_ENABLED y BACKEND_DATA_SYNC_ENABLED) valen
  # false por defecto y compose.yaml los fija a true: un arranque suelto (pruebas, ./gradlew run, un jar en otra BD)
  # no interrumpe salas ajenas, no abre /ws ni sincroniza PokéAPI sin pedirlo. dev y test encienden las salas.
  # Marca INTERRUPTED las salas/partidas que dejó abiertas el proceso anterior (interruptStaleActivity de Node).
  interrupt-stale-rooms: ${INTERRUPT_STALE_ROOMS:false}
  rooms:
    # Salas en Java (/ws); apagadas, /ws cierra con 4403 sin tocar el coordinador.
    enabled: ${ROOMS_ENABLED:false}
  data-sync:
    # Sincronización con PokéAPI y TCGdex: con false no corre el planificador, ni la sincronización inicial
    # (ensureInitialPokemon, que bloquea el arranque con el catálogo vacío), ni se marcan como fallidas ejecuciones
    # interrumpidas. En dev se enciende a mano (npm run db:seed) para no sincronizar en cada arranque. Variable propia
    # (no DATA_SYNC_ENABLED, la del oráculo Node): exportar un .env de Node al proceso Java no la enciende.
    enabled: ${BACKEND_DATA_SYNC_ENABLED:false}
    hour: ${DATA_SYNC_HOUR:6}
    minute: ${DATA_SYNC_MINUTE:0}
    time-zone: ${DATA_SYNC_TIMEZONE:Europe/Madrid}
    # PokéAPI y origen de los sprites (raw.githubusercontent.com); solo las pruebas los cambian. Exigen https (http solo
    # hacia loopback).
    pokeapi-base-url: ${POKEAPI_BASE_URL:`https://pokeapi.co/api/v2`}
    sprite-base-url: ${POKEAPI_SPRITE_BASE_URL:`https://raw.githubusercontent.com`}
    # TCGdex (Node usa https://api.tcgdex.net/v2/en fijo); mismas reglas de origen.
    tcgdex-base-url: ${TCGDEX_BASE_URL:`https://api.tcgdex.net/v2/en`}
  sprites:
    # Miniaturas del buscador. Al arrancar se descargan en segundo plano las de todos los Pokémon por defecto (4 a la
    # vez) para que la primera búsqueda no espere al origen; test lo apaga.
    warmup:
      enabled: ${SPRITE_WARMUP_ENABLED:true}
    # Copia en disco para que un despliegue no las pierda; vacío la desactiva. compose.yaml la pone dentro del volumen
    # de avatares (el único escribible y persistente del contenedor). Relativo a backend/ en dev:backend.
    cache-dir: ${SPRITE_CACHE_DIR:.data/sprite-cache}
  ws:
    # Ping a cada sesión de /ws (pingInterval de Socket.IO); 0 lo desactiva. El proxy debe tolerar más que esto.
    heartbeat-seconds: ${WS_HEARTBEAT_SECONDS:25}
