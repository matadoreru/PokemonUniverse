micronaut:
  application:
    name: pokemon-universe-backend
  server:
    port: ${PORT:8080}
    # Segunda guarda tras el latido de /ws (pu.ws.heartbeat-seconds): Netty cierra una conexión inactiva al cumplirse.
    idle-timeout: ${SERVER_IDLE_TIMEOUT:10m}
    # Detección de clientes muertos (pingTimeout de Socket.IO): un cliente vivo contesta cada ping de 25 s con un pong,
    # así que 60 s sin leer nada (≈ 2,4 latidos) cierran la conexión (1001) y el coordinador ve la desconexión.
    read-idle-timeout: ${WS_READ_IDLE_TIMEOUT:60s}
    write-idle-timeout: ${SERVER_IDLE_TIMEOUT:10m}
  router:
    static-resources:
      swagger:
        paths: classpath:META-INF/swagger
        mapping: /swagger/**
      swagger-ui:
        paths: classpath:META-INF/swagger/views/swagger-ui
        mapping: /swagger-ui/**
  metrics:
    enabled: true
    export:
      prometheus:
        enabled: true
        step: PT1M
        descriptions: true
  serde:
    serialization:
      inclusion: NON_NULL
endpoints:
  health:
    enabled: true
    sensitive: false
    details-visible: ANONYMOUS
    disk-space:
      enabled: false
  prometheus:
    enabled: true
    sensitive: false
datasources:
  default:
    driver-class-name: org.postgresql.Driver
    dialect: POSTGRES
# La migración automática de Micronaut solo se activa en test (application-test.yml); en el resto de entornos la
# ejecuta PrismaSchemaGuard después de comprobar que Prisma ya creó el esquema. Los ajustes se mantienen iguales.
flyway:
  datasources:
    default:
      enabled: false
      baseline-on-migrate: true
      baseline-version: 1
      validate-on-migrate: true
jpa:
  default:
    entity-scan:
      packages: es.pokemonuniverse.adapters.out.persistence
    properties:
      hibernate:
        globally_quoted_identifiers: true
        globally_quoted_identifiers_skip_column_definitions: true
        physical_naming_strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        jdbc:
          time_zone: UTC
        hbm2ddl:
          auto: none
pu:
  auth:
    cookie-secure: ${COOKIE_SECURE:false}
  web-origin: ${WEB_ORIGIN:http://localhost:5173}
  rate-limit-disabled: ${RATE_LIMIT_DISABLED:false}
  avatar-storage-dir: ${AVATAR_STORAGE_DIR:.data/avatars}
  # PNG del modo Artwork (local-artwork:<id>); en dev, el mismo directorio que indexa Node.
  artwork-dir: ${POKEMON_ARTWORK_DIR:../apps/server/assets/pokemon-artworks}
  commit-sha: ${PU_COMMIT_SHA:}
  room-max-players: ${ROOM_MAX_PLAYERS:8}
  reconnect-grace-ms: ${RECONNECT_GRACE_MS:30000}
  # Marca INTERRUPTED las salas/partidas abiertas al arrancar. Activar en el cutover 2D cuando Java sea el único
  # dueño de las salas; antes rompería el historial de las salas vivas de Node sobre la misma base de datos.
  interrupt-stale-rooms: ${INTERRUPT_STALE_ROOMS:false}
  rooms:
    # Salas en Java (/ws). Apagadas en producción durante la etapa 2A: /ws cierra con 4403 sin tocar el coordinador.
    # Activas en dev y test; el corte 2D pone ROOMS_ENABLED=true en compose.
    enabled: ${ROOMS_ENABLED:false}
  data-sync:
    # Sincronización con PokéAPI y TCGdex. Apagada mientras Node sea el dueño (etapa 2C): con false no corre el
    # planificador, ni la sincronización inicial, ni se marcan como fallidas las ejecuciones de otro proceso.
    # Variable propia (no DATA_SYNC_ENABLED, que es la de Node): exportar el .env de Node al proceso Java no arranca
    # un segundo sincronizador sobre la misma BD. En el corte 2D pasa a true y Node deja de sincronizar.
    enabled: ${BACKEND_DATA_SYNC_ENABLED:false}
    hour: ${DATA_SYNC_HOUR:6}
    minute: ${DATA_SYNC_MINUTE:0}
    time-zone: ${DATA_SYNC_TIMEZONE:Europe/Madrid}
    # PokéAPI y origen de los sprites (raw.githubusercontent.com); solo las pruebas los cambian. Exigen https (http solo
    # hacia loopback).
    pokeapi-base-url: ${POKEAPI_BASE_URL:`https://pokeapi.co/api/v2`}
    sprite-base-url: ${POKEAPI_SPRITE_BASE_URL:`https://raw.githubusercontent.com`}
    # TCGdex (Node usa https://api.tcgdex.net/v2/en fijo); mismas reglas de origen.
    tcgdex-base-url: ${TCGDEX_BASE_URL:`https://api.tcgdex.net/v2/en`}
  ws:
    # Ping a cada sesión de /ws (pingInterval de Socket.IO); 0 lo desactiva. El proxy debe tolerar más que esto.
    heartbeat-seconds: ${WS_HEARTBEAT_SECONDS:25}
