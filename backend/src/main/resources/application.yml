micronaut:
  application:
    name: pokemon-universe-backend
  server:
    port: ${PORT:8080}
  router:
    static-resources:
      swagger:
        paths: classpath:META-INF/swagger
        mapping: /swagger/**
      swagger-ui:
        paths: classpath:META-INF/swagger/views/swagger-ui
        mapping: /swagger-ui/**
  metrics:
    enabled: true
    export:
      prometheus:
        enabled: true
        step: PT1M
        descriptions: true
  serde:
    serialization:
      inclusion: NON_NULL
endpoints:
  health:
    enabled: true
    sensitive: false
    details-visible: ANONYMOUS
    disk-space:
      enabled: false
  prometheus:
    enabled: true
    sensitive: false
datasources:
  default:
    driver-class-name: org.postgresql.Driver
    dialect: POSTGRES
flyway:
  datasources:
    default:
      enabled: true
      baseline-on-migrate: true
      baseline-version: 1
      validate-on-migrate: true
jpa:
  default:
    entity-scan:
      packages: es.pokemonuniverse.adapters.out.persistence
    properties:
      hibernate:
        globally_quoted_identifiers: true
        globally_quoted_identifiers_skip_column_definitions: true
        physical_naming_strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        jdbc:
          time_zone: UTC
        hbm2ddl:
          auto: none
pu:
  auth:
    cookie-secure: ${COOKIE_SECURE:false}
  web-origin: ${WEB_ORIGIN:http://localhost:5173}
  rate-limit-disabled: ${RATE_LIMIT_DISABLED:false}
  avatar-storage-dir: ${AVATAR_STORAGE_DIR:.data/avatars}
  commit-sha: ${PU_COMMIT_SHA:}
