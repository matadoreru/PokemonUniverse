# Ajustes específicos del entorno dev: BD local de compose.local.yaml
datasources:
  default:
    url: jdbc:postgresql://localhost:5432/pokemon_universe
    username: pokemon
    password: pokemon
test-resources:
  enabled: false
pu:
  auth:
    secret: ${JWT_SECRET:dev-secret-dev-secret-dev-secret-0000000}
  # Node (npm run dev -w @pokemon-universe/server) se ejecuta desde apps/server y guarda en .data/avatars;
  # dev:backend se ejecuta desde backend/, así que hay que apuntar al mismo directorio para servir los avatares
  # de invitado que sube Node.
  avatar-storage-dir: ${AVATAR_STORAGE_DIR:../apps/server/.data/avatars}
  # Salas Java en /ws activas (en producción están apagadas hasta el corte 2D).
  rooms:
    enabled: true
micronaut:
  server:
    cors:
      enabled: true
      configurations:
        web:
          allowed-origins:
            - ${WEB_ORIGIN:http://localhost:5173}
          allow-credentials: true
