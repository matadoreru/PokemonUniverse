# Ajustes específicos del entorno dev: BD local de compose.local.yaml
datasources:
  default:
    url: jdbc:postgresql://localhost:5432/pokemon_universe
    username: pokemon
    password: pokemon
test-resources:
  enabled: false
pu:
  auth:
    secret: ${JWT_SECRET:dev-secret-dev-secret-dev-secret-0000000}
  # dev:backend se ejecuta desde backend/: los avatares de desarrollo quedan en backend/.data/avatars (ignorado por git).
  avatar-storage-dir: ${AVATAR_STORAGE_DIR:.data/avatars}
  # Salas Java en /ws activas (en producción las enciende compose.yaml).
  rooms:
    enabled: true
micronaut:
  server:
    cors:
      enabled: true
      configurations:
        web:
          allowed-origins:
            - ${WEB_ORIGIN:http://localhost:5173}
          allow-credentials: true
