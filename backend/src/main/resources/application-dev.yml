# Ajustes específicos del entorno dev: BD local de compose.local.yaml
datasources:
  default:
    url: jdbc:postgresql://localhost:5432/pokemon_universe
    username: pokemon
    password: pokemon
test-resources:
  enabled: false
pu:
  auth:
    secret: ${JWT_SECRET:dev-secret-dev-secret-dev-secret-0000000}
micronaut:
  server:
    cors:
      enabled: true
      configurations:
        web:
          allowed-origins:
            - ${WEB_ORIGIN:http://localhost:5173}
          allow-credentials: true
