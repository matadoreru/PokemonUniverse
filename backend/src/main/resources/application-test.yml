# Ajustes específicos del entorno test: Test Resources inyecta url, usuario y contraseña.
# Flyway aplica V1__baseline.sql sobre la BD vacía de Testcontainers.
# Es el único entorno con la migración automática de Micronaut (fuera de test la hace PrismaSchemaGuard).
# Puerto aleatorio: las pruebas no dependen de que 8080 esté libre.
micronaut:
  server:
    port: -1
flyway:
  datasources:
    default:
      enabled: true
      baseline-on-migrate: false
pu:
  auth:
    secret: test-secret-test-secret-test-secret-1234
  # Sin límite por defecto: muchas pruebas comparten la IP de loopback. RateLimitFilterTest lo activa.
  rate-limit-disabled: true
  # Directorio temporal (existe, así que no hay aviso de directorio ausente) sin PNG con ids del catálogo de pruebas.
  artwork-dir: ${java.io.tmpdir}
  # Salas Java en /ws activas (en producción están apagadas hasta el corte 2D).
  rooms:
    enabled: true
