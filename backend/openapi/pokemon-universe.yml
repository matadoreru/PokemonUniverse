openapi: 3.0.1
info:
  title: Pokémon Universe API
  version: "0.1"
paths:
  /api/admin/active-rooms:
    get:
      tags:
      - admin
      summary: Salas activas en memoria
      operationId: adminActiveRooms
      parameters:
      - name: page
        in: query
        description: "Página (entero >= 1, por defecto 1)"
        schema:
          minimum: 1
          type: integer
          format: int64
          default: 1
      - name: search
        in: query
        description: Texto recortado de hasta 80 caracteres
        schema:
          maxLength: 80
          type: string
          default: ""
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminActiveRoomsPage"
        "400":
          description: Query inválida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          description: Cuenta registrada requerida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Se requiere administrador
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/admin/changelog:
    get:
      tags:
      - admin
      summary: "Todas las entradas del changelog, publicadas o no"
      operationId: adminListChangelog
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminChangelogController.EntriesResponse"
        "401":
          description: Cuenta registrada requerida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Se requiere administrador
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      tags:
      - admin
      summary: Crear una entrada del changelog
      operationId: adminCreateChangelog
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCreateChangelogRequest"
      responses:
        "201":
          description: Creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminChangelogController.EntryResponse"
        "400":
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          description: Cuenta registrada requerida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Se requiere administrador
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Versión duplicada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/admin/changelog/{id}:
    delete:
      tags:
      - admin
      summary: Borrar una entrada del changelog
      operationId: adminDeleteChangelog
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Sin contenido
        "400":
          description: Id demasiado largo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          description: Cuenta registrada requerida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Se requiere administrador
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      tags:
      - admin
      summary: Editar una entrada del changelog
      operationId: adminUpdateChangelog
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUpdateChangelogRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminChangelogController.EntryResponse"
        "400":
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          description: Cuenta registrada requerida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Se requiere administrador
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Versión duplicada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/admin/data-sync:
    get:
      tags:
      - admin
      summary: Estado de la sincronización de datos
      operationId: adminDataSyncOverview
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDataSyncController.OverviewResponse"
        "401":
          description: Cuenta registrada requerida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Se requiere administrador
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Data-sync desactivado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/admin/data-sync/{source}:
    post:
      tags:
      - admin
      summary: Lanzar una sincronización de datos
      operationId: adminStartDataSync
      parameters:
      - name: source
        in: path
        required: true
        schema:
          type: string
          enum:
          - pokemon
          - tcg
          - all
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminStartDataSyncRequest"
      responses:
        "202":
          description: Aceptada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDataSyncController.StartResponse"
        "400":
          description: "Origen o cuerpo inválido, o Full Sync sin confirmar"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          description: Cuenta registrada requerida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Se requiere administrador
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: El origen ya se está sincronizando
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Data-sync desactivado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/admin/feedback:
    get:
      tags:
      - admin
      summary: Feedback recibido
      operationId: adminListFeedback
      parameters:
      - name: page
        in: query
        description: "Página (entero >= 1, por defecto 1)"
        schema:
          minimum: 1
          type: integer
          format: int64
          default: 1
      - name: search
        in: query
        description: Texto recortado de hasta 80 caracteres
        schema:
          maxLength: 80
          type: string
          default: ""
      - name: reference
        in: query
        schema:
          $ref: "#/components/schemas/FeedbackReference"
      - name: status
        in: query
        schema:
          $ref: "#/components/schemas/FeedbackStatus"
      - name: type
        in: query
        schema:
          $ref: "#/components/schemas/FeedbackType"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminFeedbackController.FeedbackPageResponse"
        "400":
          description: Query inválida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          description: Cuenta registrada requerida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Se requiere administrador
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/admin/feedback/{id}/status:
    patch:
      tags:
      - admin
      summary: Cambiar el estado de un feedback
      operationId: adminUpdateFeedbackStatus
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminFeedbackStatusRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminFeedbackController.FeedbackResponse"
        "400":
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          description: Cuenta registrada requerida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Se requiere administrador
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/admin/games:
    get:
      tags:
      - admin
      summary: Historial de partidas
      operationId: adminGames
      parameters:
      - name: page
        in: query
        description: "Página (entero >= 1, por defecto 1)"
        schema:
          minimum: 1
          type: integer
          format: int64
          default: 1
      - name: search
        in: query
        description: Texto recortado de hasta 80 caracteres
        schema:
          maxLength: 80
          type: string
          default: ""
      - name: status
        in: query
        schema:
          type: string
          enum:
          - IN_PROGRESS
          - COMPLETED
          - ABANDONED
          - INTERRUPTED
      - name: gameId
        in: query
        description: "Id exacto (recortado, hasta 64 caracteres)"
        schema:
          maxLength: 64
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminGamesPage"
        "400":
          description: Query inválida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          description: Cuenta registrada requerida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Se requiere administrador
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/admin/rooms:
    get:
      tags:
      - admin
      summary: Historial de salas
      operationId: adminRooms
      parameters:
      - name: page
        in: query
        description: "Página (entero >= 1, por defecto 1)"
        schema:
          minimum: 1
          type: integer
          format: int64
          default: 1
      - name: search
        in: query
        description: Texto recortado de hasta 80 caracteres
        schema:
          maxLength: 80
          type: string
          default: ""
      - name: status
        in: query
        schema:
          type: string
          enum:
          - ACTIVE
          - CLOSED
          - INTERRUPTED
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRoomsPage"
        "400":
          description: Query inválida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          description: Cuenta registrada requerida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Se requiere administrador
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/admin/summary:
    get:
      tags:
      - admin
      summary: Resumen de administración
      operationId: adminSummary
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSummary"
        "401":
          description: Cuenta registrada requerida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Se requiere administrador
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/admin/users:
    get:
      tags:
      - admin
      summary: Usuarios registrados
      operationId: adminUsers
      parameters:
      - name: page
        in: query
        description: "Página (entero >= 1, por defecto 1)"
        schema:
          minimum: 1
          type: integer
          format: int64
          default: 1
      - name: search
        in: query
        description: Texto recortado de hasta 80 caracteres
        schema:
          maxLength: 80
          type: string
          default: ""
      - name: role
        in: query
        schema:
          type: string
          enum:
          - USER
          - ADMIN
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUsersPage"
        "400":
          description: Query inválida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          description: Cuenta registrada requerida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Se requiere administrador
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/auth/avatars/{filename}:
    get:
      tags:
      - auth
      summary: Obtener imagen de avatar
      operationId: avatar
      parameters:
      - name: filename
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            image/webp:
              schema:
                type: string
                format: binary
        "404":
          description: No encontrado
  /api/auth/guest:
    post:
      tags:
      - auth
      summary: Entrar como invitado
      operationId: guest
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestRequest"
        required: true
      responses:
        "201":
          description: Creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/auth/guest/custom-avatar:
    post:
      tags:
      - auth
      summary: Entrar como invitado con un avatar subido
      operationId: createGuestWithCustomAvatar
      parameters:
      - name: displayName
        in: query
        description: "Nombre del invitado (2 a 24 letras, números, espacios, `_` o\
          \ `-`)."
        explode: false
        schema:
          type: string
          nullable: true
      requestBody:
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
        required: true
      responses:
        "201":
          description: Creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: Nombre (incidencias Zod) o imagen no válidos
          content:
            application/json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/ValidationErrorResponse"
                - $ref: "#/components/schemas/ApiError"
        "413":
          description: Más de 5 MiB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "415":
          description: "No es JPEG, PNG ni WEBP"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Demasiadas peticiones
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/auth/login:
    post:
      tags:
      - auth
      summary: Iniciar sesión
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Credenciales incorrectas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/auth/logout:
    post:
      tags:
      - auth
      summary: Cerrar sesión
      operationId: logout
      responses:
        "204":
          description: Sin contenido
  /api/auth/me:
    get:
      tags:
      - auth
      summary: Usuario de la sesión actual
      operationId: me
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
  /api/auth/profile:
    get:
      tags:
      - auth
      summary: Perfil con estadísticas por minijuego
      operationId: profile
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
        "401":
          description: Cuenta registrada requerida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/auth/profile/avatar:
    delete:
      tags:
      - auth
      summary: Volver al avatar por defecto
      operationId: resetAvatar
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          description: Cuenta registrada requerida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Demasiadas peticiones
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/auth/profile/avatar/custom:
    put:
      tags:
      - auth
      summary: Subir un avatar personalizado
      operationId: uploadCustomAvatar
      requestBody:
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: Imagen no válida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Cuenta registrada requerida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          description: Más de 5 MiB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "415":
          description: "No es JPEG, PNG ni WEBP"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Demasiadas peticiones
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/auth/register:
    post:
      tags:
      - auth
      summary: Registrar usuario
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
        required: true
      responses:
        "201":
          description: Creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Ya existe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/categories:
    get:
      tags:
      - categories
      summary: Listar mis categorías personalizadas
      operationId: listCustomCategories
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomCategoryController.CategoriesResponse"
        "401":
          description: Cuenta registrada requerida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      tags:
      - categories
      summary: Crear una categoría personalizada
      operationId: createCustomCategory
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCustomCategoryRequest"
      responses:
        "201":
          description: Creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomCategoryController.CategoryResponse"
        "400":
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          description: Cuenta registrada requerida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Duplicada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/categories/{id}:
    delete:
      tags:
      - categories
      summary: Borrar una categoría personalizada
      operationId: deleteCustomCategory
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Sin contenido
        "400":
          description: Id demasiado largo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          description: Cuenta registrada requerida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      tags:
      - categories
      summary: Editar o activar/desactivar una categoría personalizada
      operationId: updateCustomCategory
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCustomCategoryRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomCategoryController.CategoryResponse"
        "400":
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          description: Cuenta registrada requerida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Duplicada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/changelog:
    get:
      tags:
      - changelog
      summary: Listar el changelog público
      operationId: listChangelog
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangelogController.ChangelogResponse"
