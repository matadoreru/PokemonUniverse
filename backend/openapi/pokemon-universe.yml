      - profileVisibility
      - progress
      - user
      type: object
      properties:
        user:
          $ref: "#/components/schemas/ProfileResponse.ProfileUser"
        globalStats:
          $ref: "#/components/schemas/ProfileResponse.GlobalStats"
        progress:
          $ref: "#/components/schemas/ProfileResponse.Progress"
        games:
          type: array
          items:
            $ref: "#/components/schemas/ProfileResponse.ProfileGame"
        profileVisibility:
          $ref: "#/components/schemas/ProfileVisibility"
      description: '`profileVisibility` es el ajuste \<\<Perfil visible para\>\>.'
    ProfileResponse.ProfileGame:
      required:
      - description
      - icon
      - id
      - minPlayers
      - name
      - profileStats
      - stats
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        icon:
          type: string
        description:
          type: string
        experimental:
          type: boolean
          nullable: true
        recommended:
          type: boolean
          nullable: true
        minPlayers:
          type: integer
          format: int32
        maxPlayers:
          type: integer
          format: int32
          nullable: true
        profileStats:
          $ref: "#/components/schemas/GameManifest.ProfileStatsDefinition"
        stats:
          $ref: "#/components/schemas/ProfileResponse.GameStats"
      description: "Manifiesto sin `defaultConfig`, con las estadisticas del usuario\
        \ en ese minijuego."
    ProfileResponse.ProfileUser:
      required:
      - avatar
      - createdAt
      - email
      - id
      - username
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        email:
          type: string
        avatar:
          $ref: "#/components/schemas/AvatarRef"
        createdAt:
          type: string
    ProfileResponse.Progress:
      required:
      - level
      - levelXp
      - nextLevelXp
      - xp
      type: object
      properties:
        level:
          type: integer
          format: int32
        xp:
          type: integer
          format: int32
        levelXp:
          type: integer
          format: int32
        nextLevelXp:
          type: integer
          format: int32
      description: "Nivel y experiencia: `levelXp` y `nextLevelXp` son la experiencia\
        \ total donde empiezan este nivel y el siguiente."
    ProfileSettingsRequest:
      required:
      - profileVisibility
      type: object
      properties:
        profileVisibility:
          pattern: ^(EVERYONE|FRIENDS|NOBODY)$
          type: string
          enum:
          - EVERYONE
          - FRIENDS
          - NOBODY
          x-pattern-message: Elige quién puede ver tu perfil
          x-not-null-message: Elige quién puede ver tu perfil
      description: "Cuerpo de `PATCH /api/auth/profile`: el ajuste \\<\\<Perfil visible\
        \ para\\>\\>."
    ProfileSettingsResponse:
      required:
      - profileVisibility
      type: object
      properties:
        profileVisibility:
          $ref: "#/components/schemas/ProfileVisibility"
      description: "Respuesta de `PATCH /api/auth/profile`: el ajuste ya guardado."
    ProfileVisibility:
      type: string
      description: "Ajuste \\<\\<Perfil visible para\\>\\> de una cuenta: quién ve\
        \ su nivel, sus estadísticas y sus logros."
      enum:
      - EVERYONE
      - FRIENDS
      - NOBODY
    ProgressResponse:
      required:
      - progress
      type: object
      properties:
        progress:
          $ref: "#/components/schemas/ProfileResponse.Progress"
      description: "Respuesta `{\"progress\": ...}` de `GET /api/auth/progress` (ProgressResponse\
        \ en shared)."
    PublicProfile.Friendship:
      type: string
      description: Relación de quien mira con el dueño del perfil.
      enum:
      - NONE
      - PENDING_SENT
      - PENDING_RECEIVED
      - FRIENDS
      - SELF
    PublicProfileResponse:
      required:
      - profile
      type: object
      properties:
        profile:
          $ref: "#/components/schemas/PublicProfileResponse.Profile"
      description: "Respuesta `{\"profile\": ...}` de `GET /api/users/{username}/profile`.\
        \ Con `private: true` no salen `progress`, `stats` ni `achievements` (ni sus\
        \ claves); `requestId` solo con una solicitud pendiente entre las dos cuentas.\
        \ `stats` y `achievements` tienen la forma del perfil propio y de `GET /api/achievements`,\
        \ pero los logros son solo los desbloqueados."
    PublicProfileResponse.Profile:
      required:
      - friendship
      - private
      - user
      - visibility
      type: object
      properties:
        user:
          $ref: "#/components/schemas/PublicProfileResponse.User"
        visibility:
          $ref: "#/components/schemas/ProfileVisibility"
        friendship:
          $ref: "#/components/schemas/PublicProfile.Friendship"
        requestId:
          type: string
          nullable: true
        private:
          type: boolean
        progress:
          nullable: true
          allOf:
          - $ref: "#/components/schemas/ProfileResponse.Progress"
        stats:
          nullable: true
          allOf:
          - $ref: "#/components/schemas/PublicProfileResponse.Stats"
        achievements:
          nullable: true
          allOf:
          - $ref: "#/components/schemas/AchievementsResponse"
    PublicProfileResponse.Stats:
      required:
      - games
      - globalStats
      type: object
      properties:
        globalStats:
          $ref: "#/components/schemas/ProfileResponse.GlobalStats"
        games:
          type: array
          items:
            $ref: "#/components/schemas/ProfileResponse.ProfileGame"
    PublicProfileResponse.User:
      required:
      - avatar
      - id
      - username
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        avatar:
          $ref: "#/components/schemas/AvatarRef"
        createdAt:
          type: string
          nullable: true
      description: "Sin email: solo lo público de la cuenta; sin `createdAt` si el\
        \ perfil es privado."
    RegisterRequest:
      required:
      - email
      - password
      - username
      type: object
      properties:
        username:
          maxLength: 24
          minLength: 3
          pattern: "^[a-zA-Z0-9_]+$"
          type: string
          x-pattern-message: "El nombre de usuario solo admite letras, números y guion\
            \ bajo"
          x-size-message: El nombre de usuario debe tener entre 3 y 24 caracteres
        email:
          maxLength: 254
          minLength: 1
          type: string
          format: email
          x-pattern-message: El email no es válido
          x-size-message: El email no puede superar los 254 caracteres
        password:
          maxLength: 128
          minLength: 10
          type: string
          x-size-message: La contraseña debe tener entre 10 y 128 caracteres
          x-not-null-message: La contraseña es obligatoria
    ResetPasswordRequest:
      required:
      - password
      - token
      type: object
      properties:
        token:
          maxLength: 128
          minLength: 1
          type: string
          x-size-message: El enlace no es válido
        password:
          maxLength: 128
          minLength: 10
          type: string
          x-size-message: La contraseña debe tener entre 10 y 128 caracteres
          x-not-null-message: La contraseña es obligatoria
    RoomPhase:
      type: string
      description: "`RoomPhase` de `room.ts`: el lobby, cualquier fase de un minijuego\
        \ y las fases de sesión."
      enum:
      - LOBBY
      - GAME_STARTING
      - ROUND_ACTIVE
      - ROUND_RESULTS
      - TIEBREAKER_ACTIVE
      - ROLE_REVEAL
      - CLUE_PHASE
      - VOTING
      - VOTE_RESULTS
      - ELIMINATION
      - SELECTING_TYPES
      - TYPE_REVEAL
      - INVALID_COMBINATION
      - POKEMON_SEARCH
      - TURN_ACTIVE
      - CHOICE_REVEAL
      - DISCUSSION
      - REVOTE
      - GAME_RESULTS
      - NEXT_GAME_VOTE
      - NEXT_GAME_VOTE_RESULTS
      - SESSION_RESULTS
    RoomRole:
      type: string
      description: "Rol de permisos en la sala (`ROOM_ROLES`), independiente del rol\
        \ en el minijuego."
      enum:
      - HOST
      - CO_HOST
      - MEMBER
    SelectorPokemon:
      required:
      - id
      - name
      - sprite
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        sprite:
          type: string
      description: "Entrada del buscador de Pokémon: solo id, nombre y una URL de\
        \ sprite opaca servida por Java. Sin número de Pokédex, generación, tipos,\
        \ estadísticas ni sprite shiny, que darían la respuesta en varios minijuegos."
    SendFriendRequest:
      required:
      - username
      type: object
      properties:
        username:
          maxLength: 24
          minLength: 1
          type: string
          x-size-message: El nombre de usuario no puede superar los 24 caracteres
      description: "Cuerpo de `POST /api/friends/requests`: el nombre de usuario de\
        \ la cuenta a la que se pide la amistad."
    SyncOverviewItem:
      required:
      - durationMs
      - error
      - inserted
      - lastAttemptAt
      - lastFullSyncAt
      - lastSyncAt
      - nextSyncAt
      - ready
      - recordsAvailable
      - recordsProcessed
      - skipped
      - source
      - status
      - updated
      type: object
      properties:
        source:
          $ref: "#/components/schemas/DataSyncSource"
        status:
          $ref: "#/components/schemas/SyncOverviewItem.Status"
        ready:
          type: boolean
        lastSyncAt:
          type: string
          nullable: true
        lastAttemptAt:
          type: string
          nullable: true
        lastFullSyncAt:
          type: string
          nullable: true
        durationMs:
          type: integer
          format: int32
          nullable: true
        recordsProcessed:
          type: integer
          format: int32
        inserted:
          type: integer
          format: int32
        updated:
          type: integer
          format: int32
        skipped:
          type: integer
          format: int32
        recordsAvailable:
          type: integer
          format: int32
        error:
          type: string
          nullable: true
        nextSyncAt:
          type: string
      description: Estado de un origen para la administración (`SyncOverviewItem`
        / `AdminDataSyncItem`). Las fechas son cadenas `toISOString()` y los nulos
        se serializan (la configuración global omite los nulos).
    SyncOverviewItem.Status:
      type: string
      description: "`IDLE` existe en el contrato, pero nunca se produce (como en Node)."
      enum:
      - IDLE
      - RUNNING
      - FAILED
      - COMPLETED
      - NOT_READY
    TcgCardCatalog.FilterOptions:
      required:
      - cardCount
      - generations
      - rarities
      - ready
      - sets
      type: object
      properties:
        ready:
          type: boolean
        cardCount:
          type: integer
          format: int32
        generations:
          type: array
          items:
            $ref: "#/components/schemas/TcgCardCatalog.GenerationOption"
        sets:
          type: array
          items:
            $ref: "#/components/schemas/TcgCardCatalog.SetOption"
        rarities:
          type: array
          items:
            $ref: "#/components/schemas/TcgCardCatalog.RarityOption"
    TcgCardCatalog.GenerationOption:
      required:
      - cardCount
      - value
      type: object
      properties:
        value:
          type: integer
          format: int32
        cardCount:
          type: integer
          format: int32
    TcgCardCatalog.RarityOption:
      required:
      - cardCount
      - value
      type: object
      properties:
        value:
          type: string
        cardCount:
          type: integer
          format: int32
    TcgCardCatalog.SetOption:
      required:
      - cardCount
      - id
      - name
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        cardCount:
          type: integer
          format: int32
    TcgController.EligibilityResponse:
      required:
      - cardCount
      type: object
      properties:
        cardCount:
          type: integer
          format: int32
      description: "`{cardCount}`: cartas de `cardsFor(config)`."
    TcgHigherLowerConfigBody:
      required:
      - generations
      - maxPrice
      - minPrice
      - rarities
      - roundSeconds
      - rounds
      - setIds
      - showRarity
      type: object
      properties:
        generations:
          minItems: 1
          type: array
          items:
            maximum: 9
            minimum: 1
            type: integer
            format: int32
        setIds:
          type: array
          items:
            minLength: 1
            type: string
        rarities:
          type: array
          items:
            minLength: 1
            type: string
        minPrice:
          pattern: ^\d+(?:\.\d+)?$
          type: string
          nullable: true
        maxPrice:
          pattern: ^\d+(?:\.\d+)?$
          type: string
          nullable: true
        showRarity:
          type: boolean
        rounds:
          maximum: 50
          minimum: 5
          type: integer
          format: int32
        roundSeconds:
          maximum: 60
          minimum: 5
          type: integer
          format: int32
      description: "Configuración completa de Higher or Lower: Cartas; las claves\
        \ desconocidas se ignoran."
    UpdateCustomCategoryRequest:
      type: object
      properties:
        text:
          maxLength: 160
          minLength: 4
          type: string
        enabled:
          type: boolean
      description: "Estricto: al menos uno de los dos campos, ninguno admite `null`\
        \ y una clave desconocida es un 400 `unrecognized_keys`."
    UpdateWouldYouRatherPromptRequest:
      type: object
      properties:
        optionA:
          maxLength: 180
          minLength: 4
          type: string
        optionB:
          maxLength: 180
          minLength: 4
          type: string
        enabled:
          type: boolean
      description: "Estricto: al menos uno de los tres campos, ninguno admite `null`\
        \ y una clave desconocida es un 400 `unrecognized_keys`."
    UserResponse:
      required:
      - user
      type: object
      properties:
        user:
          nullable: true
          allOf:
          - $ref: "#/components/schemas/AuthUser"
      description: "Respuesta `{\"user\": ...}`; la clave se escribe siempre, tambié\
        n como `null`."
    UserRole:
      type: string
      enum:
      - USER
      - ADMIN
    ValidationErrorResponse:
      required:
      - error
      - issues
      type: object
      properties:
        error:
          type: string
        issues:
          type: array
          items:
            $ref: "#/components/schemas/ZodIssue"
      description: "400 con incidencias de Zod: `error` es el mensaje de la primera\
        \ incidencia."
    WouldYouRatherPromptController.PromptResponse:
      required:
      - prompt
      type: object
      properties:
        prompt:
          $ref: "#/components/schemas/WouldYouRatherPromptView"
    WouldYouRatherPromptController.PromptsResponse:
      required:
      - prompts
      type: object
      properties:
        prompts:
          type: array
          items:
            $ref: "#/components/schemas/WouldYouRatherPromptView"
    WouldYouRatherPromptView:
      required:
      - createdAt
      - enabled
      - id
      - optionA
      - optionB
      - updatedAt
      type: object
      properties:
        id:
          type: string
        optionA:
          type: string
        optionB:
          type: string
        enabled:
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: string
      description: Vista pública de un dilema (`CustomWouldYouRatherPromptView` de
        `packages/shared`); fechas ISO con milisegundos.
    ZodIssue:
      required:
      - code
      - message
      - path
      type: object
      properties:
        code:
          type: string
        path:
          type: array
          items:
            oneOf:
            - type: string
            - type: integer
              format: int32
        message:
          type: string
      additionalProperties: true
      description: "Incidencia de Zod 4: `code`, `path` y `message` siempre; el resto\
        \ de claves depende del código (`expected`, `origin`, `minimum`, `maximum`,\
        \ `inclusive`, `keys`, ...)."
