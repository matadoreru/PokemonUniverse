openapi: 3.0.1
info:
  title: Pokémon Universe API
  version: "0.1"
paths:
  /api/auth/avatars/{filename}:
    get:
      tags:
      - auth
      summary: Obtener imagen de avatar
      operationId: avatar
      parameters:
      - name: filename
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            image/webp:
              schema:
                type: string
                format: binary
        "404":
          description: No encontrado
  /api/auth/guest:
    post:
      tags:
      - auth
      summary: Entrar como invitado
      operationId: guest
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestRequest"
        required: true
      responses:
        "201":
          description: Creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/auth/login:
    post:
      tags:
      - auth
      summary: Iniciar sesión
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Credenciales incorrectas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/auth/logout:
    post:
      tags:
      - auth
      summary: Cerrar sesión
      operationId: logout
      responses:
        "204":
          description: Sin contenido
  /api/auth/me:
    get:
      tags:
      - auth
      summary: Usuario de la sesión actual
      operationId: me
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
  /api/auth/profile:
    get:
      tags:
      - auth
      summary: Perfil con estadísticas por minijuego
      operationId: profile
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
        "401":
          description: Cuenta registrada requerida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/auth/register:
    post:
      tags:
      - auth
      summary: Registrar usuario
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
        required: true
      responses:
        "201":
          description: Creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Ya existe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/categories:
    get:
      tags:
      - categories
      summary: Listar mis categorías personalizadas
      operationId: listCustomCategories
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomCategoryController.CategoriesResponse"
        "401":
          description: Cuenta registrada requerida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      tags:
      - categories
      summary: Crear una categoría personalizada
      operationId: createCustomCategory
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCustomCategoryRequest"
      responses:
        "201":
          description: Creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomCategoryController.CategoryResponse"
        "400":
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          description: Cuenta registrada requerida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Duplicada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/categories/{id}:
    delete:
      tags:
      - categories
      summary: Borrar una categoría personalizada
      operationId: deleteCustomCategory
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Sin contenido
        "400":
          description: Id demasiado largo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          description: Cuenta registrada requerida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      tags:
      - categories
      summary: Editar o activar/desactivar una categoría personalizada
      operationId: updateCustomCategory
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCustomCategoryRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomCategoryController.CategoryResponse"
        "400":
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          description: Cuenta registrada requerida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Duplicada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/changelog:
    get:
      tags:
      - changelog
      summary: Listar el changelog público
      operationId: listChangelog
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangelogController.ChangelogResponse"
  /api/feedback:
    post:
      tags:
      - feedback
      summary: Enviar feedback
      operationId: submit
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFeedbackRequest"
        required: true
      responses:
        "201":
          description: Creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackController.FeedbackResponse"
        "400":
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Sesión requerida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/games:
    get:
      tags:
      - games
      summary: Listar minijuegos
      operationId: listGames
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GamesController.GamesResponse"
  /api/health:
    get:
      tags:
      - health
      summary: Estado del servicio
      operationId: getHealth
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/pokemon:
    get:
      tags:
      - pokemon
      summary: Catálogo Pokémon
      operationId: listPokemon
      parameters:
      - name: generations
        in: query
        explode: false
        schema:
          type: string
          nullable: true
      - name: includeForms
        in: query
        explode: false
        schema:
          type: string
          nullable: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PokemonController.PokemonResponse"
  /api/rooms/{code}/games/{assetToken}/rounds/{roundNumber}/options/{optionId}/audio:
    get:
      tags:
      - rooms
      summary: Grito de una opción de ronda
      operationId: gameRoundAudio
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
      - name: assetToken
        in: path
        required: true
        schema:
          type: string
      - name: roundNumber
        in: path
        required: true
        schema:
          type: string
      - name: optionId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            audio/ogg:
              schema:
                type: string
                format: binary
        "404":
          description: No encontrado
        "415":
          description: El recurso no es audio
        "503":
          description: Demasiados recursos en curso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/rooms/{code}/games/{assetToken}/rounds/{roundNumber}/options/{optionId}/sprite:
    get:
      tags:
      - rooms
      summary: Imagen de una opción de ronda
      operationId: gameRoundSprite
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
      - name: assetToken
        in: path
        required: true
        schema:
          type: string
      - name: roundNumber
        in: path
        required: true
        schema:
          type: string
      - name: optionId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            image/png:
              schema:
                type: string
                format: binary
        "404":
          description: No encontrado
        "503":
          description: Demasiados recursos en curso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/would-you-rather-prompts:
    get:
      tags:
      - would-you-rather-prompts
      summary: Listar mis dilemas de Would You Rather
      operationId: listWouldYouRatherPrompts
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WouldYouRatherPromptController.PromptsResponse"
        "401":
          description: Cuenta registrada requerida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      tags:
      - would-you-rather-prompts
      summary: Crear un dilema de Would You Rather
      operationId: createWouldYouRatherPrompt
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWouldYouRatherPromptRequest"
      responses:
        "201":
          description: Creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WouldYouRatherPromptController.PromptResponse"
        "400":
          description: Datos inválidos u opciones iguales tras normalizar
          content:
            application/json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/ValidationErrorResponse"
                - $ref: "#/components/schemas/ApiError"
        "401":
          description: Cuenta registrada requerida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Pareja duplicada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/would-you-rather-prompts/import:
    post:
      tags:
      - would-you-rather-prompts
      summary: Importar dilemas desde JSON (todo o nada)
      operationId: importWouldYouRatherPrompts
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportWouldYouRatherPromptsRequest"
      responses:
        "201":
          description: Importados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WouldYouRatherPromptController.PromptsResponse"
        "400":
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          description: Cuenta registrada requerida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Parejas duplicadas en el JSON o ya existentes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/would-you-rather-prompts/{id}:
    delete:
      tags:
      - would-you-rather-prompts
      summary: Borrar un dilema
      operationId: deleteWouldYouRatherPrompt
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Sin contenido
        "400":
          description: Id demasiado largo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          description: Cuenta registrada requerida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      tags:
      - would-you-rather-prompts
      summary: Editar o activar/desactivar un dilema
      operationId: updateWouldYouRatherPrompt
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWouldYouRatherPromptRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WouldYouRatherPromptController.PromptResponse"
        "400":
          description: Datos inválidos u opciones iguales tras normalizar
          content:
            application/json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/ValidationErrorResponse"
                - $ref: "#/components/schemas/ApiError"
        "401":
          description: Cuenta registrada requerida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Pareja duplicada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    ApiError:
      required:
      - error
      type: object
      properties:
        error:
          type: string
        issues:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/ApiError.Issue"
      description: "Cuerpo de error común con el servidor Node: `{\"error\": \"...\"\
        , \"issues\": [...]}`."
    ApiError.Issue:
      required:
      - message
      - path
      type: object
      properties:
        path:
          type: string
        message:
          type: string
    AuthUser:
      required:
      - avatar
      - displayName
      - id
      - kind
      type: object
      properties:
        id:
          type: string
        displayName:
          type: string
        kind:
          $ref: "#/components/schemas/AuthUser.Kind"
        email:
          type: string
          nullable: true
        role:
          nullable: true
          allOf:
          - $ref: "#/components/schemas/UserRole"
        avatar:
          $ref: "#/components/schemas/AvatarRef"
      description: Identidad autenticada (usuario registrado o invitado); es la misma
        que viaja en la cookie de sesión.
    AuthUser.Kind:
      type: string
      enum:
      - USER
      - GUEST
    AvatarRef:
      type: object
      description: Avatar de un jugador; el JSON tiene exactamente las formas que
        acepta el servidor Node.
      discriminator:
        propertyName: type
        mapping:
          PRESET: "#/components/schemas/AvatarRef.Preset"
          CUSTOM: "#/components/schemas/AvatarRef.Custom"
          DEFAULT: "#/components/schemas/AvatarRef.Default"
      oneOf:
      - $ref: "#/components/schemas/AvatarRef.Default"
      - $ref: "#/components/schemas/AvatarRef.Preset"
      - $ref: "#/components/schemas/AvatarRef.Custom"
    AvatarRef.Custom:
      required:
      - value
      - version
      type: object
      properties:
        value:
          type: string
        version:
          type: integer
          format: int64
        type:
          type: string
    AvatarRef.Default:
      type: object
    AvatarRef.Preset:
      required:
      - value
      type: object
      properties:
        value:
          type: string
        type:
          type: string
    ChangelogChange:
      required:
      - text
      - type
      type: object
      properties:
        type:
          type: string
        text:
          type: string
      description: Un cambio de una entrada del changelog (changelogChangeSchema en
        shared).
    ChangelogController.ChangelogResponse:
      required:
      - entries
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/ChangelogEntryResponse"
    ChangelogEntryResponse:
      required:
      - content
      - createdAt
      - date
      - id
      - published
      - title
      - updatedAt
      - version
      type: object
      properties:
        id:
          type: string
        version:
          type: string
        title:
          type: string
        date:
          type: string
        published:
          type: boolean
        content:
          type: array
          items:
            $ref: "#/components/schemas/ChangelogChange"
        createdAt:
          type: string
        updatedAt:
          type: string
    CreateCustomCategoryRequest:
      required:
      - text
      type: object
      properties:
        text:
          maxLength: 160
          minLength: 4
          type: string
      description: "Estricto: una clave desconocida es un 400 `unrecognized_keys`."
    CreateFeedbackRequest:
      required:
      - description
      - type
      type: object
      properties:
        reference:
          nullable: true
          allOf:
          - $ref: "#/components/schemas/FeedbackReference"
        gameId:
          maxLength: 64
          minLength: 1
          type: string
          nullable: true
          x-size-message: Selecciona un minijuego.
        roomCode:
          pattern: "^[A-Z2-9]{6}$"
          type: string
          nullable: true
          x-pattern-message: El código de sala no es válido.
        type:
          $ref: "#/components/schemas/FeedbackType"
        description:
          maxLength: 2000
          minLength: 10
          type: string
          x-not-null-message: Describe el feedback con al menos 10 caracteres.
      description: "Cuerpo estricto: una clave desconocida falla la deserializació\
        n (como `.strict()` de Zod)."
    CreateWouldYouRatherPromptRequest:
      required:
      - optionA
      - optionB
      type: object
      properties:
        optionA:
          maxLength: 180
          minLength: 4
          type: string
        optionB:
          maxLength: 180
          minLength: 4
          type: string
      description: "Estricto: una clave desconocida es un 400 `unrecognized_keys`.\
        \ Las opciones se recortan y deben ser distintas (comparación base de `es`)."
    CustomCategoryController.CategoriesResponse:
      required:
      - categories
      type: object
      properties:
        categories:
          type: array
          items:
            $ref: "#/components/schemas/CustomCategoryView"
    CustomCategoryController.CategoryResponse:
      required:
      - category
      type: object
      properties:
        category:
          $ref: "#/components/schemas/CustomCategoryView"
    CustomCategoryView:
      required:
      - createdAt
      - enabled
      - id
      - text
      - updatedAt
      type: object
      properties:
        id:
          type: string
        text:
          type: string
        enabled:
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: string
      description: Vista pública de una categoría (`CustomCategoryView` de `packages/shared`);
        fechas ISO con milisegundos.
    FeedbackController.FeedbackResponse:
      required:
      - feedback
      type: object
      properties:
        feedback:
          $ref: "#/components/schemas/FeedbackItemResponse"
    FeedbackItemResponse:
      required:
      - author
      - createdAt
      - description
      - gameId
      - gameName
      - id
      - reference
      - roomCode
      - status
      - type
      - updatedAt
      type: object
      properties:
        id:
          type: string
        reference:
          type: string
        gameId:
          type: string
          nullable: true
        gameName:
          type: string
          nullable: true
        roomCode:
          type: string
          nullable: true
        type:
          type: string
        status:
          type: string
        description:
          type: string
        author:
          $ref: "#/components/schemas/FeedbackItemResponse.Author"
        createdAt:
          type: string
        updatedAt:
          type: string
      description: "Vista pública de un feedback; los nulos se emiten explícitos,\
        \ como hace Node."
    FeedbackItemResponse.Author:
      required:
      - displayName
      - kind
      - userId
      type: object
      properties:
        userId:
          type: string
          nullable: true
        displayName:
          type: string
        kind:
          type: string
    FeedbackReference:
      type: string
      enum:
      - GENERAL
      - MINIGAME
      - ROOMS
      - ACCOUNT
      - INTERFACE
      - CHANGELOG
      - OTHER
    FeedbackType:
      type: string
      enum:
      - BUG
      - SUGGESTION
    GameManifest:
      required:
      - defaultConfig
      - description
      - icon
      - id
      - minPlayers
      - name
      - profileStats
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        icon:
          type: string
        description:
          type: string
        experimental:
          type: boolean
          nullable: true
        recommended:
          type: boolean
          nullable: true
        minPlayers:
          type: integer
          format: int32
        maxPlayers:
          type: integer
          format: int32
          nullable: true
        profileStats:
          $ref: "#/components/schemas/GameManifest.ProfileStatsDefinition"
        defaultConfig:
          type: object
          additionalProperties:
            type: object
      description: "Manifiesto de un minijuego mas su configuracion por defecto, tal\
        \ como lo exporta el registro TypeScript."
    GameManifest.DerivedMetricDefinition:
      required:
      - denominator
      - key
      - kind
      - label
      - numerator
      type: object
      properties:
        key:
          type: string
        label:
          type: string
        kind:
          type: string
        numerator:
          type: string
        denominator:
          type: array
          items:
            type: string
        format:
          type: string
          nullable: true
    GameManifest.MetricDefinition:
      required:
      - aggregation
      - key
      - label
      type: object
      properties:
        key:
          type: string
        label:
          type: string
        aggregation:
          type: string
        format:
          type: string
          nullable: true
    GameManifest.ProfileStatsDefinition:
      required:
      - metrics
      type: object
      properties:
        metrics:
          type: array
          items:
            $ref: "#/components/schemas/GameManifest.MetricDefinition"
        derivedMetrics:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/GameManifest.DerivedMetricDefinition"
    GamesController.GamesResponse:
      required:
      - games
      type: object
      properties:
        games:
          type: array
          items:
            $ref: "#/components/schemas/GameManifest"
    GuestRequest:
      required:
      - displayName
      type: object
      properties:
        displayName:
          maxLength: 24
          minLength: 2
          pattern: "^[\\p{L}\\p{N}_ -]+$"
          type: string
          x-pattern-message: El nombre contiene caracteres no permitidos
