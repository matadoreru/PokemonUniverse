      - id
      - role
      - totalPoints
      - updatedAt
      - username
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        email:
          type: string
        role:
          type: string
        gamesPlayed:
          type: integer
          format: int32
        gamesWon:
          type: integer
          format: int32
        totalPoints:
          type: integer
          format: int32
        createdAt:
          type: string
        updatedAt:
          type: string
      description: '`AdminUserItem` de `shared/admin.ts`.'
    AdminUsersPage:
      required:
      - items
      - page
      - pageSize
      - total
      - totalPages
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminUserItem"
        page:
          type: integer
          format: int64
        pageSize:
          type: integer
          format: int32
        total:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int64
      description: Solo documenta la página concreta en OpenAPI.
    ApiError:
      required:
      - error
      type: object
      properties:
        error:
          type: string
        issues:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/ApiError.Issue"
      description: "Cuerpo de error común con el servidor Node: `{\"error\": \"...\"\
        , \"issues\": [...]}`."
    ApiError.Issue:
      required:
      - message
      - path
      type: object
      properties:
        path:
          type: string
        message:
          type: string
    AuthUser:
      required:
      - avatar
      - displayName
      - id
      - kind
      type: object
      properties:
        id:
          type: string
        displayName:
          type: string
        kind:
          $ref: "#/components/schemas/AuthUser.Kind"
        email:
          type: string
          nullable: true
        role:
          nullable: true
          allOf:
          - $ref: "#/components/schemas/UserRole"
        avatar:
          $ref: "#/components/schemas/AvatarRef"
      description: Identidad autenticada (usuario registrado o invitado); es la misma
        que viaja en la cookie de sesión.
    AuthUser.Kind:
      type: string
      enum:
      - USER
      - GUEST
    AvatarRef:
      type: object
      description: "Avatar de un jugador: la inicial (`DEFAULT`) o una imagen subida\
        \ (`CUSTOM`). Los avatares predefinidos (`PRESET`) ya no existen."
      discriminator:
        propertyName: type
        mapping:
          CUSTOM: "#/components/schemas/AvatarRef.Custom"
          DEFAULT: "#/components/schemas/AvatarRef.Default"
      oneOf:
      - $ref: "#/components/schemas/AvatarRef.Default"
      - $ref: "#/components/schemas/AvatarRef.Custom"
    AvatarRef.Custom:
      required:
      - value
      - version
      type: object
      properties:
        value:
          type: string
        version:
          type: integer
          format: int64
        type:
          type: string
    AvatarRef.Default:
      type: object
    ChangelogChange:
      required:
      - text
      - type
      type: object
      properties:
        type:
          type: string
        text:
          type: string
      description: Un cambio de una entrada del changelog (changelogChangeSchema en
        shared).
    ChangelogController.ChangelogResponse:
      required:
      - entries
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/ChangelogEntryResponse"
    ChangelogEntryResponse:
      required:
      - content
      - createdAt
      - date
      - id
      - published
      - title
      - updatedAt
      - version
