      type: object
      properties:
        activeRooms:
          type: integer
          format: int32
        gamesInProgress:
          type: integer
          format: int32
        registeredUsers:
          type: integer
          format: int64
        interruptedToday:
          type: integer
          format: int64
        updatedAt:
          type: string
      description: '`AdminSummary` de `shared/admin.ts`.'
    AdminUpdateChangelogRequest:
      type: object
      properties:
        version:
          type: string
        title:
          maxLength: 120
          minLength: 3
          type: string
        date:
          type: string
          format: date-time
        published:
          type: boolean
