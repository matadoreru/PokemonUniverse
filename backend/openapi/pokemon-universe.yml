components:
  schemas:
    AchievementResponse:
      required:
      - description
      - family
      - gameId
      - id
      - name
      - unlockedAt
      type: object
      properties:
        id:
          type: string
        family:
          type: string
        gameId:
          type: string
          nullable: true
        name:
          type: string
        description:
          type: string
        unlockedAt:
          type: string
          nullable: true
      description: "Un logro de la cuenta; `gameId` y `unlockedAt` salen siempre,\
        \ con `null` si no aplican."
    AchievementsResponse:
      required:
      - achievements
      - total
      - unlocked
      type: object
      properties:
        achievements:
          type: array
          items:
            $ref: "#/components/schemas/AchievementResponse"
        unlocked:
          type: integer
          format: int32
        total:
          type: integer
          format: int32
      description: Los logros de la cuenta con el recuento de desbloqueados.
    AdminActiveRoom:
      required:
      - code
      - connectedPlayers
      - createdAt
      - gameId
      - gameName
      - hostDisplayName
      - id
      - maxPlayers
      - participants
      - phase
      - totalPlayers
      - updatedAt
      type: object
      properties:
        id:
          type: string
        code:
          type: string
        phase:
          $ref: "#/components/schemas/RoomPhase"
        gameId:
          type: string
          nullable: true
        gameName:
          type: string
          nullable: true
        connectedPlayers:
          type: integer
          format: int32
        totalPlayers:
          type: integer
          format: int32
        maxPlayers:
          type: integer
          format: int32
        hostDisplayName:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
        participants:
          type: array
          items:
            $ref: "#/components/schemas/AdminActiveRoom.Participant"
      description: "`AdminActiveRoom`: proyección segura para administración (sin\
        \ estado de juego ni correos)."
    AdminActiveRoom.Participant:
      required:
      - displayName
      - id
      - kind
      - presence
      - roomRole
      type: object
      properties:
        id:
          type: string
        displayName:
          type: string
        kind:
          $ref: "#/components/schemas/AuthUser.Kind"
        presence:
          $ref: "#/components/schemas/PresenceStatus"
        roomRole:
          $ref: "#/components/schemas/RoomRole"
    AdminActiveRoomsPage:
      required:
      - items
      - page
      - pageSize
      - total
      - totalPages
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminActiveRoom"
        page:
          type: integer
          format: int64
        pageSize:
          type: integer
          format: int32
        total:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int64
      description: Solo documenta la página concreta en OpenAPI.
    AdminChangelogController.EntriesResponse:
      required:
      - entries
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/ChangelogEntryResponse"
    AdminChangelogController.EntryResponse:
      required:
      - entry
      type: object
      properties:
        entry:
          $ref: "#/components/schemas/ChangelogEntryResponse"
    AdminCreateChangelogRequest:
      required:
      - content
      - date
      - title
      - version
      type: object
      properties:
        version:
          pattern: "^\\d+\\.\\d+\\.\\d+(?:-[0-9A-Za-z.-]+)?$"
          type: string
        title:
          maxLength: 120
          minLength: 3
          type: string
        summary:
          maxLength: 200
          type: string
          description: Recortado; vacío = sin resumen.
        date:
          type: string
          format: date-time
        published:
          type: boolean
          default: false
        content:
          type: array
          description: "Como máximo 3 con `highlight: true`."
          items:
            $ref: "#/components/schemas/ChangelogChange"
      description: "Estricto: una clave desconocida es un 400 `unrecognized_keys`."
    AdminDataSyncController.OverviewResponse:
      required:
      - sources
      type: object
      properties:
        sources:
          type: array
          items:
            $ref: "#/components/schemas/SyncOverviewItem"
    AdminDataSyncController.StartResponse:
      required:
      - accepted
      - mode
      - source
      type: object
      properties:
        accepted:
          type: boolean
        source:
          type: string
        mode:
          type: string
    AdminFeedbackController.FeedbackPageResponse:
      required:
      - items
      - overview
      - page
      - pageSize
      - total
      - totalPages
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FeedbackItemResponse"
        page:
          type: integer
          format: int64
        pageSize:
          type: integer
          format: int32
        total:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int64
        overview:
          $ref: "#/components/schemas/FeedbackService.Overview"
    AdminFeedbackController.FeedbackResponse:
      required:
      - feedback
      type: object
      properties:
        feedback:
          $ref: "#/components/schemas/FeedbackItemResponse"
    AdminFeedbackStatusRequest:
      required:
      - status
      type: object
      properties:
        status:
          $ref: "#/components/schemas/FeedbackStatus"
      description: "Estricto: una clave desconocida es un 400 `unrecognized_keys`."
    AdminGameHistoryItem:
      required:
      - endedAt
      - gameId
      - gameName
      - id
      - participants
      - playerCount
      - roomCode
      - startedAt
      - status
      type: object
      properties:
        id:
          type: string
        roomCode:
          type: string
        gameId:
          type: string
        gameName:
          type: string
        playerCount:
          type: integer
          format: int32
        status:
          type: string
        startedAt:
          type: string
        endedAt:
