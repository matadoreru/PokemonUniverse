      - optionA
      - optionB
      - updatedAt
      type: object
      properties:
        id:
          type: string
        optionA:
          type: string
        optionB:
          type: string
        enabled:
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: string
      description: Vista pública de un dilema (`CustomWouldYouRatherPromptView` de
        `packages/shared`); fechas ISO con milisegundos.
    ZodIssue:
      required:
      - code
      - message
      - path
      type: object
      properties:
        code:
          type: string
        path:
          type: array
          items:
            oneOf:
            - type: string
            - type: integer
              format: int32
        message:
          type: string
      additionalProperties: true
      description: "Incidencia de Zod 4: `code`, `path` y `message` siempre; el resto\
