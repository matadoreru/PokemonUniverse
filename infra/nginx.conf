server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # Avatares: 5 MiB en el backend (AvatarService.MAX_UPLOAD_BYTES) y 10 MB de max-request-size en Micronaut. El
  # límite de nginx iguala al de Micronaut para que un cuerpo grande reciba el 413 JSON del backend, no el de nginx
  # (por defecto nginx corta en 1 MB).
  client_max_body_size 10m;

  # Cabeceras de seguridad de todas las respuestas. Un add_header dentro de una location anula las heredadas del
  # server: la location de estáticos las repite.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Desde el corte 2D el backend Java sirve toda la API. ^~ hace que ninguna regex (la de estáticos de abajo) le
  # quite rutas como /api/auth/avatars/<id>.webp. proxy_pass sin URI reenvía la ruta original sin normalizar ni
  # decodificar: las variantes (//api/admin, /api/%61dmin, /api/ADMIN) llegan tal cual y las resuelve Micronaut.
  location ^~ /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  # Salas (WebSocket). Coincidencia exacta: /ws/... no llega al backend. 75 s de lectura/escritura > latido de 25 s
  # del servidor.
  location = /ws {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
  }
  location / { try_files $uri $uri/ /index.html; }
  location ~* \.(js|css|png|svg|ico|woff2)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri =404;
  }
}
