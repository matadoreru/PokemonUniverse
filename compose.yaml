name: pokemon-universe

services:
  postgres:
    image: postgres:17-alpine
    container_name: pokemon-universe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${PU_POSTGRES_DB:-pokemon_universe}"
      POSTGRES_USER: "${PU_POSTGRES_USER:-pokemon}"
      POSTGRES_PASSWORD: "${PU_POSTGRES_PASSWORD:?Define PU_POSTGRES_PASSWORD en .env}"
    volumes:
      - pokemon_universe_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PU_POSTGRES_USER:-pokemon} -d ${PU_POSTGRES_DB:-pokemon_universe}"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    pids_limit: 100
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  migrate:
    image: "${PU_SERVER_IMAGE:-ghcr.io/matadoreru/pokemon-universe-server}:${PU_IMAGE_TAG:-latest}"
    restart: "no"
    command: ["./node_modules/.bin/prisma", "migrate", "deploy", "--schema", "apps/server/prisma/schema.prisma"]
    environment: &database_environment
      DATABASE_URL: "postgresql://${PU_POSTGRES_USER:-pokemon}:${PU_POSTGRES_PASSWORD:?Define PU_POSTGRES_PASSWORD en .env}@postgres:5432/${PU_POSTGRES_DB:-pokemon_universe}?schema=public"
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  seed:
    image: "${PU_SERVER_IMAGE:-ghcr.io/matadoreru/pokemon-universe-server}:${PU_IMAGE_TAG:-latest}"
    restart: "no"
    command: ["node", "apps/server/dist/prisma/seed.js"]
    environment: *database_environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  server:
    image: "${PU_SERVER_IMAGE:-ghcr.io/matadoreru/pokemon-universe-server}:${PU_IMAGE_TAG:-latest}"
    container_name: pokemon-universe-server
    restart: unless-stopped
    environment:
      <<: *database_environment
      NODE_ENV: production
      PORT: "3001"
      WEB_ORIGIN: "${PU_PUBLIC_ORIGIN:?Define PU_PUBLIC_ORIGIN en .env}"
      JWT_SECRET: "${PU_JWT_SECRET:?Define PU_JWT_SECRET en .env}"
      COOKIE_SECURE: "${PU_SECURE_COOKIE:-true}"
      ROOM_MAX_PLAYERS: "${PU_ROOM_MAX_PLAYERS:-8}"
      RECONNECT_GRACE_MS: "${PU_RECONNECT_GRACE_MS:-30000}"
    depends_on:
      seed:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 150
    labels:
      - "com.centurylinklabs.watchtower.enable=${PU_WATCHTOWER_ENABLE:-false}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    stop_grace_period: 20s
    logging: *logging

  web:
    image: "${PU_WEB_IMAGE:-ghcr.io/matadoreru/pokemon-universe-web}:${PU_IMAGE_TAG:-latest}"
    container_name: pokemon-universe-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PU_HOST_PORT:-8080}:8080"
    depends_on:
      server:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /var/cache/nginx:size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 100
    labels:
      - "com.centurylinklabs.watchtower.enable=${PU_WATCHTOWER_ENABLE:-false}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging: *logging

volumes:
  pokemon_universe_postgres_data:
    name: pokemon_universe_postgres_data
