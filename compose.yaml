name: "${PU_COMPOSE_PROJECT_NAME:-pokemon-universe}"

services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    container_name: "${PU_COMPOSE_PROJECT_NAME:-pokemon-universe}-postgres"
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${PU_POSTGRES_DB:-pokemon_universe}"
      POSTGRES_USER: "${PU_POSTGRES_USER:-pokemon}"
      POSTGRES_PASSWORD: "${PU_POSTGRES_PASSWORD:?Define PU_POSTGRES_PASSWORD en .env}"
    volumes:
      - pokemon_universe_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PU_POSTGRES_USER:-pokemon} -d ${PU_POSTGRES_DB:-pokemon_universe}"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    pids_limit: 100
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  backend:
    image: "${PU_BACKEND_IMAGE:-ghcr.io/matadoreru/pokemon-universe-backend}:${PU_IMAGE_TAG:-latest}"
    container_name: "${PU_COMPOSE_PROJECT_NAME:-pokemon-universe}-backend"
    restart: unless-stopped
    environment:
      MICRONAUT_ENVIRONMENTS: prod
      PORT: "8080"
      JDBC_URL: "jdbc:postgresql://postgres:5432/${PU_POSTGRES_DB:-pokemon_universe}"
      DB_USER: "${PU_POSTGRES_USER:-pokemon}"
      DB_PASSWORD: "${PU_POSTGRES_PASSWORD:?Define PU_POSTGRES_PASSWORD en .env}"
      JWT_SECRET: "${PU_JWT_SECRET:?Define PU_JWT_SECRET en .env}"
      WEB_ORIGIN: "${PU_PUBLIC_ORIGIN:?Define PU_PUBLIC_ORIGIN en .env}"
      COOKIE_SECURE: "${PU_SECURE_COOKIE:-true}"
      AVATAR_STORAGE_DIR: "/data/avatars"
      # Copia en disco de las miniaturas del buscador: en el volumen de avatares para que un despliegue no la pierda.
      SPRITE_CACHE_DIR: "/data/avatars/sprite-cache"
      ROOM_MAX_PLAYERS: "${PU_ROOM_MAX_PLAYERS:-8}"
      RECONNECT_GRACE_MS: "${PU_RECONNECT_GRACE_MS:-30000}"
      # PNG del modo Artwork (local-artwork:<id>), copiados en la imagen desde backend/assets/pokemon-artworks.
      POKEMON_ARTWORK_DIR: "/app/pokemon-artworks"
      # Java es el único servidor: salas en /ws, salas y partidas abiertas por el proceso anterior marcadas
      # INTERRUPTED al arrancar, y sincronización con PokéAPI y TCGdex. No dependen de PU_ROOMS_ENABLED ni
      # PU_DATA_SYNC_ENABLED: un .env antiguo con esos valores a false (los de antes del corte 2D) no los apaga.
      # PU_CUTOVER_ROLLBACK_JAVA es interna de scripts/deploy.sh (nunca en .env): solo el rollback del primer despliegue
      # tras el corte la pone a false, cuando vuelve a arrancar Node sin el compose anterior; Node y Java nunca sirven
      # salas ni sincronizan a la vez.
      ROOMS_ENABLED: "${PU_CUTOVER_ROLLBACK_JAVA:-true}"
      INTERRUPT_STALE_ROOMS: "${PU_CUTOVER_ROLLBACK_JAVA:-true}"
      BACKEND_DATA_SYNC_ENABLED: "${PU_CUTOVER_ROLLBACK_JAVA:-true}"
      DATA_SYNC_HOUR: "${PU_DATA_SYNC_HOUR:-6}"
      DATA_SYNC_MINUTE: "${PU_DATA_SYNC_MINUTE:-0}"
      DATA_SYNC_TIMEZONE: "${PU_DATA_SYNC_TIMEZONE:-Europe/Madrid}"
      # Correo saliente (recuperar contraseña). Sin SMTP_HOST el backend solo registra los correos en el log.
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-465}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      MAIL_FROM: "${MAIL_FROM:-Pokémon Universe <no-responder@matadoreru.com>}"
    volumes:
      - pokemon_universe_avatar_data:/data/avatars
    # Flyway crea o reconoce el esquema al arrancar: solo hace falta PostgreSQL.
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 150
    labels:
      - "com.centurylinklabs.watchtower.enable=${PU_WATCHTOWER_ENABLE:-false}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health/readiness"]
      interval: 30s
      timeout: 5s
      # Con el catálogo vacío (despliegue nuevo), ensureInitialPokemon sincroniza PokéAPI antes de abrir el puerto:
      # 107 s medidos en local (DEPLOY.md); 5 min dan margen para arm64 y una PokéAPI lenta. Un arranque sano pasa
      # a healthy en el primer chequeo que responde, sin esperar al final del periodo.
      start_period: 5m
      retries: 3
    stop_grace_period: 20s
    logging: *logging

  web:
    image: "${PU_WEB_IMAGE:-ghcr.io/matadoreru/pokemon-universe-web}:${PU_IMAGE_TAG:-latest}"
    container_name: "${PU_COMPOSE_PROJECT_NAME:-pokemon-universe}-web"
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PU_HOST_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /var/cache/nginx:size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 100
    labels:
      - "com.centurylinklabs.watchtower.enable=${PU_WATCHTOWER_ENABLE:-false}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging: *logging

volumes:
  pokemon_universe_postgres_data:
    name: "${PU_POSTGRES_VOLUME:-pokemon_universe_postgres_data}"
  pokemon_universe_avatar_data:
    name: "${PU_AVATAR_VOLUME:-pokemon_universe_avatar_data}"
